<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>机会雷达 Alpha</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --surface-soft: #f1f4f7;
      --surface-tint: #edf7f5;
      --text: #18212f;
      --muted: #627083;
      --subtle: #8c97a5;
      --line: #dce3eb;
      --line-strong: #c6d0dc;
      --accent: #176b5f;
      --accent-strong: #0f4f47;
      --warn: #8a5a10;
      --warn-bg: #fff4df;
      --shadow: 0 12px 28px rgba(28, 40, 58, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.55;
      letter-spacing: 0;
    }

    button, select { font: inherit; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 22px 44px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      margin: -24px -22px 18px;
      padding: 18px 22px 14px;
      background: rgba(247, 248, 250, 0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(260px, 1fr) minmax(220px, 320px);
      gap: 16px;
      align-items: end;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 600;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .field label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    select {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      padding: 8px 10px;
      outline: none;
    }

    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(23, 107, 95, 0.12);
    }

    .sample-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 14px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 26px;
      max-width: 100%;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .notice {
      margin: 0 0 14px;
      padding: 10px 12px;
      border: 1px solid #efd8a9;
      border-radius: 8px;
      background: var(--warn-bg);
      color: var(--warn);
      font-size: 13px;
    }

    .evidence-policy {
      margin: 0 0 14px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
    }

    .evidence-policy strong { color: var(--text); font-weight: 600; }

    .opportunity-list { display: grid; gap: 10px; }

    .opportunity-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .opportunity-button {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      padding: 15px 16px;
    }

    .opportunity-button:hover { background: var(--surface-soft); }
    .opportunity-button.active { background: var(--surface-tint); }

    .row-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 16px;
      align-items: start;
    }

    .rank-title {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      min-width: 0;
    }

    .rank {
      flex: 0 0 auto;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--surface-soft);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35;
      word-break: break-word;
    }

    .summary {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
      word-break: break-word;
    }

    .eyebrow {
      margin-bottom: 4px;
      color: var(--subtle);
      font-size: 12px;
      font-weight: 500;
    }

    .metric {
      min-width: 78px;
      text-align: right;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .metric strong {
      display: block;
      color: var(--text);
      font-size: 18px;
      line-height: 1.15;
      font-weight: 600;
    }

    .toggle-mark {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid var(--line-strong);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      line-height: 1;
    }

    .details {
      display: none;
      border-top: 1px solid var(--line);
      padding: 14px 16px 16px;
    }

    .details.open { display: block; }

    .judgement {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .fact {
      min-width: 0;
      padding: 10px;
      border-radius: 8px;
      background: var(--surface-soft);
    }

    .fact-label {
      color: var(--subtle);
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 5px;
    }

    .fact-value {
      color: var(--text);
      font-size: 13px;
      word-break: break-word;
    }

    .fact-value ul {
      margin: 0;
      padding-left: 18px;
    }

    .fact-value li + li { margin-top: 4px; }

    .detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }

    .section {
      min-width: 0;
      padding-top: 2px;
    }

    .cluster-section {
      grid-column: 1 / -1;
    }

    .section h2 {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .section p {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 7px;
    }

    .list li {
      position: relative;
      padding-left: 14px;
      color: var(--muted);
      font-size: 13px;
      word-break: break-word;
    }

    .list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.72em;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
    }

    .supply-research { display: grid; gap: 10px; }
    .supply-status { color: var(--text); font-weight: 700; }
    .supply-group { border-top: 1px solid var(--line); padding-top: 9px; }
    .supply-group:first-of-type { border-top: 0; padding-top: 0; }
    .supply-group-title { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
    .supply-item { padding: 8px 0; }
    .supply-item + .supply-item { border-top: 1px dashed var(--line); }
    .supply-item-name { color: var(--text); font-weight: 700; }
    .supply-item-meta { display: flex; flex-wrap: wrap; gap: 5px; margin: 5px 0; }
    .supply-tag { padding: 2px 7px; border-radius: 999px; background: var(--soft); color: var(--muted); font-size: 11px; }
    .supply-detail { color: var(--muted); line-height: 1.55; }
    .supply-source-links { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 8px; }
    .supply-quote { margin-top: 5px; color: var(--muted); font-style: italic; }

    .cluster-list {
      display: grid;
      gap: 7px;
    }

    .cluster-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .cluster-row:hover, .cluster-row.active { background: var(--surface-tint); }

    .cluster-name {
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      word-break: break-word;
    }

    .cluster-count {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .cluster-panel {
      display: grid;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
    }

    .cluster-panel-title {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
      justify-content: space-between;
    }

    .insight-card {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .hypothesis-card {
      display: grid;
      gap: 10px;
      padding: 11px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface);
    }

    .hypothesis-head {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      justify-content: space-between;
      align-items: flex-start;
    }

    .hypothesis-title {
      margin: 0;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      word-break: break-word;
    }

    .hypothesis-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .hypothesis-grid .fact { background: var(--surface-soft); }

    .insight-item {
      min-width: 0;
      display: grid;
      gap: 4px;
    }

    .insight-label {
      color: var(--subtle);
      font-size: 12px;
      font-weight: 500;
    }

    .insight-value {
      color: var(--text);
      font-size: 13px;
      word-break: break-word;
    }

    .funnel-list {
      display: grid;
      gap: 7px;
    }

    .funnel-block {
      display: grid;
      gap: 6px;
      padding: 8px;
      border-left: 3px solid var(--accent);
      background: var(--surface);
      border-radius: 0 8px 8px 0;
    }

    .source-tail {
      margin-top: 6px;
      color: var(--subtle);
      font-size: 12px;
      word-break: break-word;
    }

    .evidence-list {
      grid-column: 1 / -1;
      display: grid;
      gap: 8px;
      margin-top: 2px;
    }

    .evidence-head {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
      justify-content: space-between;
    }

    .evidence-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .small-button {
      min-height: 30px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      padding: 4px 9px;
      font-size: 12px;
      cursor: pointer;
    }

    .small-button:hover { background: var(--surface-soft); }

    .evidence {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 11px;
      background: var(--surface);
    }

    .quote {
      margin: 0 0 8px;
      color: var(--text);
      font-size: 13px;
      word-break: break-word;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 10px;
      color: var(--subtle);
      font-size: 12px;
    }

    .meta span { white-space: nowrap; }
    .signal-tag {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 1px 6px;
      background: var(--surface-soft);
      color: var(--muted);
    }
    .context {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      word-break: break-word;
    }

    .loading, .empty {
      padding: 24px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 820px) {
      .topbar-inner { grid-template-columns: 1fr; align-items: stretch; }
      .judgement { grid-template-columns: 1fr 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
      .insight-card, .hypothesis-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      .page { padding: 18px 12px 34px; }
      .topbar { margin: -18px -12px 14px; padding: 14px 12px 12px; }
      h1 { font-size: 19px; }
      .row-main { grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
      .metric { grid-column: 1 / -1; text-align: left; padding-left: 36px; }
      .judgement { grid-template-columns: 1fr; }
      .opportunity-button { padding: 13px 12px; }
      .details { padding: 12px; }
      .meta span { white-space: normal; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="topbar-inner">
        <div>
          <h1>机会雷达 Alpha</h1>
          <p class="subtitle">从评论证据出发，按「人群 → 家长关心的问题 → 具体需求 → 机会假设」阅读用户声音。</p>
        </div>
        <div class="field">
          <label for="audienceSelect">人群</label>
          <select id="audienceSelect">
            <option value="grade1">小学一年级家长</option>
          </select>
        </div>
      </div>
    </header>

    <div class="notice">顶部卡片用于定位家长最关心的问题，点开后继续看具体需求、评论证据、供给与缺口。</div>
    <div id="sampleLine" class="sample-line"></div>
    <div id="app" class="loading">正在读取已有样本数据...</div>
  </div>

  <script id="radar-config" type="application/json">{}</script>
  <script>
    const RADAR_CONFIG = window.RADAR_CONFIG || JSON.parse(document.getElementById("radar-config")?.textContent || "{}");
    const AGE_MODE = RADAR_CONFIG.mode === "age";
    const LEGACY_DATA_URL = "grade1-data.json?v=018";
    const DATA_URL = RADAR_CONFIG.dataUrl || (AGE_MODE ? RADAR_CONFIG.dataUrl : LEGACY_DATA_URL);

    const OPPORTUNITIES = [
      {
        id: "learning-foundation-loop",
        title: "学习基础诊断与练习闭环",
        themeIds: ["T01"],
        clusterIds: ["T01-C3", "T01-C1", "T01-C2"],
        sentence: "一年级家长在拼音、识字、读题、口算等基础任务卡住时，不知道孩子到底差在哪；目前靠攻略、练习册、短视频讲解和学习类 App 拼凑解决；证据来自学习基础主题下的评论；还缺对付费意愿、诊断可信度和持续使用频次的验证。",
        who: "小学一年级家长，尤其是幼小衔接后发现孩子基础跟不上的家庭",
        scene: "开学后做作业、读题、拼音听写、口算练习、老师反馈跟不上时",
        problem: "家长能看到孩子错、慢、不会，但难判断是没学会、练少了、方法错了，还是发展节奏问题。",
        current: "看小红书/抖音方法帖，买练习册和试卷，收藏讲解视频，用识字/拼音/口算 App，向老师或家长群求助。",
        supply: ["拼音/识字/口算 App，如洪恩、悟空、小猿口算、作业帮口算", "练习册、试卷、资料包、短视频讲解内容", "学习机、拍照讲题和 AI 辅导工具", "线下幼小衔接或一对一辅导"],
        gap: "供给很多，但大多是单点资料或单项练习。家长仍缺一个能判断孩子当前能力、给出优先级、安排练习并反馈进展的闭环。",
        validation: ["家长更愿意为诊断、练习内容、真人点评还是陪跑服务付费", "评论中的高频卡点是否集中在拼音、读题、数学思维或书写中的某几类", "孩子是否能独立使用，还是必须依赖家长陪同执行"]
      },
      {
        id: "homework-execution-system",
        title: "作业陪伴与家庭执行系统",
        themeIds: ["T02"],
        clusterIds: ["T02-C2", "T02-C1", "T02-C3"],
        sentence: "一年级家长在每天放学后的作业陪伴场景里，被拖拉、坐不住、反复催促和亲子冲突消耗；目前靠盯写、计时器、奖惩、托管和经验帖解决；证据来自作业陪伴主题下的评论；还缺对家庭执行工具是否真能降低家长负担的验证。",
        who: "小学低年级家长，尤其是每天亲自陪作业的妈妈/爸爸",
        scene: "放学后到睡前，作业、订正、阅读打卡、练字和收拾书包集中发生",
        problem: "孩子拖拉、姿势散、坐不住，家长越催越崩溃，作业变成固定冲突源。",
        current: "家长盯写，设时间表，用计时器，奖励惩罚，送晚托，照搬育儿博主方法，或把任务交给老人。",
        supply: ["晚托、托管、课后辅导班", "计时器、计划表、习惯打卡工具", "家长教育课程和亲子沟通内容", "学习机或作业辅导类工具"],
        gap: "多数方案只解决看管或提醒，没有把学校任务、孩子状态、家长反馈和复盘连接起来。家长需要低冲突推进，而不只是更多控制手段。",
        validation: ["家长愿意用工具解决，还是更倾向购买托管服务", "任务录入成本能否足够低", "是否能证明亲子冲突、作业时长或家长陪伴时间下降"]
      },
      {
        id: "attention-and-intervention-path",
        title: "专注力判断与家庭干预路径",
        themeIds: ["T04"],
        clusterIds: ["T04-C1", "T04-C2", "T04-C3"],
        sentence: "家长在老师反馈上课走神、写作业坐不住、拼音或阅读久练不会时，会担心是不是专注力或发展问题；目前靠训练方法、测评、医院或机构咨询解决；证据来自注意力主题评论；还缺对轻量筛查和家庭可执行干预路径的验证。",
        who: "一年级家长，特别是收到老师反馈或长期陪学受挫的家庭",
        scene: "老师反馈上课不听讲、作业无法持续、读写练很多遍仍卡住时",
        problem: "家长不知道这是习惯、能力、情绪、专注力还是 ADHD 等问题，也不知道该先训练还是就医。",
        current: "搜索专注力训练方法，咨询老师，做线上测评，去医院/机构评估，报感统或注意力训练课。",
        supply: ["专注力训练课程、感统训练机构", "线上测评和儿童发展评估", "家长教育内容、家庭训练清单", "脑电/注意力硬件和训练软件"],
        gap: "专业服务门槛高、质量不透明；内容方法碎片化。家长缺少低风险的初筛、分流和家庭训练计划。",
        validation: ["家长是否接受非医疗诊断边界清晰的初筛产品", "什么情况下会转向线下机构或医院", "家庭训练是否能持续执行并被家长感知有效"]
      },
      {
        id: "after-school-care-quality",
        title: "托管与晚辅导选择及质量监控",

    const app = document.getElementById("app");

    function safeURL(value) {
      if (typeof value !== "string" || !/^https?:\/\//i.test(value) || /[\u0000-\u0020\\]/u.test(value)) return "";
      try {
        const url = new URL(value);
        const host = url.hostname.toLowerCase();
        if (url.username || url.password || /^(?:localhost|0|127\.|10\.|192\.168\.|169\.254\.|\[.*\])/.test(host)
          || /^172\.(?:1[6-9]|2\d|3[01])\./.test(host)
          || /^100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7])\./.test(host)
          || /^(?:198\.(?:18|19)\.|(?:22[4-9]|23\d|24\d|25[0-5])\.)/.test(host)
          || /(?:^|\.)(?:internal|local|localhost|sankuai\.com|meituan\.com)$/.test(host)
          || /(?:^|\/)api(?:\/|$)/i.test(decodeURIComponent(url.pathname))) return "";
        for (const key of [...url.searchParams.keys()]) {
          if (/token|secret|auth|cookie|password|api.?key|sign|credential|track|trace|share|^utm_|^xsec_|(?:^|_)(?:did|iid|u_code)$|^(?:sec_uid|device_id|user_id|uid|open_id|session_id|spm|from|source)$/i.test(key)) url.searchParams.delete(key);
        }
        url.hash = "";
        return url.href;
      } catch { return ""; }
    }

    function visibleOpportunities() {
      const rows = AGE_MODE ? mapData.opportunities || [] : legacyThemeDomains();
      if (AGE_MODE) return rows.filter(opp => selectedAudience === "all" || opp.audience_id === selectedAudience);
      return rows;
    }

    function legacyThemeDomains() {
      if (!mapData) return [];
      return (mapData.concern_themes || []).map(theme => ({
        id: theme.theme_id,
        title: theme.concern_name,
        themeIds: [theme.theme_id],
        clusterIds: [],
        isThemeDomain: true,
        comment_count: theme.comment_count || 0,
        source_counts: theme.source_counts || {},
        post_count: theme.post_count || 0,
        rank: theme.rank || 0
      })).sort((a, b) => countComments(b) - countComments(a) || (a.rank || 999) - (b.rank || 999) || a.id.localeCompare(b.id));
    }

    function matchesContentSignal(comment) {
      if (AGE_MODE) return true;
      const profile = comment.intent_profile || {};
      return Boolean(profile.content_topic_signal) && !profile.resource_noise;
    }

    function matchesProductStrongSignal(comment) {
      if (AGE_MODE) return true;
      const profile = comment.intent_profile || {};
      const text = comment.comment_text || "";
      return Boolean(profile.product_tool_signal) || /求|需要|推荐|哪|什么|有没有/u.test(text) && /工具|软件|app|APP|自动|批改|练习册|专项|题库|学习机|错题机|打印机|计划表|打卡/u.test(text);
    }

    function matchesProductWeakSignal(comment) {
      if (AGE_MODE) return true;
      const text = comment.comment_text || "";
      return !matchesProductStrongSignal(comment) && /小程序|识字卡|学习机|学习平板|练习册|APP|app|软件|课程|工具|帮帮识字|洪恩|悟空|小猿|作业帮|拼音阅读|拼音小程序|打印机|错题机|计划表|计时器|托管|晚托|一对一/u.test(text);
    }

    function matchesResourceNoise(comment) {
      return Boolean(comment.intent_profile?.resource_noise);
    }

    function initAgeMode() {
      if (!AGE_MODE) return;
      document.title = RADAR_CONFIG.title || "3–9 岁家长机会雷达";

    function renderSupply(item) {
      if (typeof item === "string") return `<li>${escapeHtml(item)}</li>`;
      const url = safeURL(item.url);
      const name = url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.name)}</a>` : escapeHtml(item.name);
      return `<li>${name}<br>${escapeHtml(item.capability)}<br>适用观察场景：${escapeHtml(item.scene)}<br>待核实边界（非效果结论）：${escapeHtml(item.limitation || "尚未核实使用效果")}</li>`;
    }

    function unassignedEvidence() {
      return dedupeEvidence((mapData.unassigned_pool?.all_evidence || []).filter(row => ["unknown", "ambiguous"].includes(row.audience_id)));
    }

    function renderPublicError(error) {
      const codes = ["AUTH_FAILED", "HTTP_ERROR", "REQUEST_TIMEOUT", "REQUEST_FAILED", "API_ERROR", "COLLECTION_FAILED",
        "INVALID_API_PAYLOAD", "INVALID_API_JSON", "UNRECOGNIZED_SEARCH_RESPONSE", "UNRECOGNIZED_COMMENT_RESPONSE", "UNRECOGNIZED_COMMENT_CONTENT"];
      const code = codes.includes(error?.code) ? error.code : "";
      const status = error?.status != null && Number.isFinite(Number(error.status)) && Number(error.status) >= 0 ? Number(error.status) : null;
      return code || status != null ? `（${escapeHtml(code || "请求异常")}${status != null ? ` · HTTP ${escapeHtml(status)}` : ""}）` : "";
    }

    function renderCounterexamples() {
      const rows = dedupeEvidence(mapData.counterexample_pool?.all_evidence || []);
      if (!rows.length) return "";

      const controlLabels = { publish_time_filter: "内容发布时间筛选", sort: "排序", content_type: "内容类型", search_page: "搜索页", comment_sort: "评论排序" };

      const results = mapData.completion?.query_results?.length ? mapData.completion.query_results : plan.query_results || [];

    }

        ? "还未实采，当前没有真实评论，不生成问题卡片。"
        : `已有采集输入：原始评论 ${formatNum(stats.raw_comment_count)} 条，未知或歧义年龄 ${formatNum(stats.unassigned_comment_count)} 条。当前所选年龄段无确龄且命中主题的证据；年龄待确认评论不进入问题卡片。`;
      const queries = mapData.collection_status === "not_collected" ? (mapData.query_groups || []).map(group => `<p><strong>计划 ${escapeHtml(group.label)}</strong>：${escapeHtml((group.query_seeds || []).join("、"))}</p>`).join("") : "";
      return `<div class="empty"><p>${escapeHtml(message)}</p>${queries}<p>当前已核验供给 ${formatNum(mapData.verified_supply_count)} 项；官网能力不等于评论家长用过或有效。</p></div>`;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>'"]/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#39;",
        "\"": "&quot;"
      }[char]));
    }

    function formatNum(value) {
      return Number(value || 0).toLocaleString("zh-CN");
    }

    function findTheme(id) {
      return (mapData.concern_themes || []).find(theme => theme.theme_id === id);
    }

    function findClusters(opp) {
      const clusters = [];
      for (const themeId of opp.themeIds) {
        const theme = findTheme(themeId);
        if (!theme) continue;
        for (const cluster of theme.need_pain_itch_clusters || []) {
          if (!opp.clusterIds.length || opp.clusterIds.includes(cluster.cluster_id) || (!AGE_MODE && cluster.cluster_id === `${themeId}-UNCLASSIFIED`)) clusters.push(cluster);
        }
      }
      return clusters
        .filter(cluster => AGE_MODE || collectClusterEvidence(cluster).length > 0)
        .sort((a, b) => collectClusterEvidence(b).length - collectClusterEvidence(a).length || (b.comment_count || 0) - (a.comment_count || 0));
    }

    function countComments(opp) {
      if (AGE_MODE) return collectEvidence(opp).length;
      return findClusters(opp).reduce((sum, cluster) => sum + collectClusterEvidence(cluster).length, 0);
    }

    function mergeSourceCounts(opp) {
      const counts = {};
      if (AGE_MODE) {
        for (const comment of collectEvidence(opp)) {
          const source = comment.source_key || comment.source || "unknown";
          counts[source] = (counts[source] || 0) + 1;
        }
        return Object.entries(counts).map(([key, value]) => [{ xiaohongshu: "小红书", douyin: "抖音" }[key] || key, value]);
      }
      for (const cluster of findClusters(opp)) {
        for (const comment of collectClusterEvidence(cluster)) {
          const source = comment.source || "unknown";
          counts[source] = (counts[source] || 0) + 1;
        }
      }
      return Object.entries(counts).sort((a, b) => b[1] - a[1]);
    }

    function collectEvidence(opp) {
      if (AGE_MODE) return dedupeEvidence(findClusters(opp).flatMap(cluster => cluster.all_evidence || []));
      return dedupeEvidence(findClusters(opp).flatMap(cluster => cluster.all_evidence || []));
    }

    function sortEvidence(a, b) {
      return (Number(b.evidence_strength) || 0) - (Number(a.evidence_strength) || 0)
        || (Number(b.like_count) || 0) - (Number(a.like_count) || 0)
        || String(b.created_at || "").localeCompare(String(a.created_at || ""));
    }

    function dedupeEvidence(rows) {
      const seen = new Set();
      return rows.filter(comment => {
        if (!comment.comment_text) return false;
        if (comment.comment_id == null || comment.comment_id === "") return true;
        const key = JSON.stringify([comment.source_key || comment.source, String(comment.comment_id)]);
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      }).sort(sortEvidence);
    }

    function collectClusterEvidence(cluster) {
      if (AGE_MODE) return dedupeEvidence(cluster.all_evidence || []);
      return dedupeEvidence([...(cluster.all_evidence || []), ...(cluster.representative_comments || [])]);
    }

    function renderEvidencePolicy() {
      const stats = mapData.sample_stats || {};
      const recon = mapData.count_reconciliation || {};
      if (AGE_MODE) return "";
      const cardCount = visibleOpportunities().reduce((sum, opp) => sum + countComments(opp), 0);
      return `<section class="evidence-policy"><strong>口径说明：</strong>主需求证据 ${formatNum(stats.valid_comment_count)} 条，是逐条语义判断后确认属于目标家长的具体问题、咨询、经历或使用反馈；当前主题内评论 ${formatNum(cardCount)} 条。间接需求、未匹配、一般观点、人群不符和拦截项不进入主计数，均保留在页面底部台账中。</section>`;
    }

    function renderSampleLine() {
      if (AGE_MODE) {
        const stats = selectedAudience === "all" ? mapData.sample_stats || {} : mapData.sample_stats?.audience_stats?.[selectedAudience] || {};
        const evidence = dedupeEvidence(visibleOpportunities().flatMap(collectEvidence));
        const sourceCounts = {};
        evidence.forEach(comment => { const key = comment.source_key || comment.source; sourceCounts[key] = (sourceCounts[key] || 0) + 1; });
        sampleLine.innerHTML = [
          `<span class="pill">所选主题域证据 ${formatNum(evidence.length)}</span>`,
          `<span class="pill">原始评论 ${formatNum(stats.raw_comment_count)}</span>`,
          `<span class="pill">全样本年龄待确认 ${formatNum(mapData.sample_stats?.unassigned_comment_count)}</span>`,
          `<span class="pill">小红书证据 ${formatNum(sourceCounts.xiaohongshu)}</span>`,
          `<span class="pill">抖音证据 ${formatNum(sourceCounts.douyin)}</span>`,
          `<span class="pill">已核验供给 ${formatNum(mapData.verified_supply_count)}</span>`
        ].join("");
        document.querySelector(".notice").textContent = mapData.notice || RADAR_CONFIG.notice || "采集完成状态未确认。";
        return;
      }
      const stats = mapData.sample_stats || {};
      const sourceCounts = mapData.count_reconciliation?.platform_evidence_counts || {};
      const rawSourceCounts = stats.source_counts || {};
      const scopeText = sampleScopeText();
      sampleLine.innerHTML = [
        `<span class="pill">原始评论 ${formatNum(stats.raw_comment_count)}</span>`,
        `<span class="pill">主需求证据 ${formatNum(stats.valid_comment_count)}</span>`,
        `<span class="pill">间接需求 ${formatNum(stats.indirect_signal_count)}</span>`,
        `<span class="pill">未匹配 ${formatNum(stats.unmatched_comment_count)}</span>`,
        `<span class="pill">一般观点 ${formatNum(stats.low_signal_count)}</span>`,
        `<span class="pill">拦截 ${formatNum(stats.intercepted_comment_count)}</span>`,
        `<span class="pill">人群不符 ${formatNum(stats.out_of_scope_count)}</span>`,
        `<span class="pill">小红书主证据 ${formatNum(sourceCounts["小红书"])}</span>`,
        `<span class="pill">抖音主证据 ${formatNum(sourceCounts["抖音"])}</span>`,
        mapData.supply_research ? `<span class="pill">供给已扫描 ${formatNum(mapData.supply_research.quality?.sub_need_count)}</span>` : "",
        mapData.supply_research ? `<span class="pill">有供给 ${formatNum(mapData.supply_research.quality?.covered_sub_need_count)} / 无可靠供给 ${formatNum(mapData.supply_research.quality?.no_reliable_supply_count)}</span>` : "",
        `<span class="pill">帖子/视频 ${formatNum(stats.post_count)}</span>`,
        `<span class="pill">搜索第一页样本${scopeText ? ` · ${escapeHtml(scopeText)}` : ""}</span>`
      ].filter(Boolean).join("");
    }

    function sampleScopeText() {
      const plan = mapData.sampling_plan || {};
      const sourceEntries = Object.entries(plan.sources || {});
      const timeFilters = [...new Set(sourceEntries.map(([, rule]) => rule.publish_time_filter).filter(Boolean))];
      const sortFilters = [...new Set(sourceEntries.map(([source, rule]) => `${source} ${rule.sort || "默认排序"}`).filter(Boolean))];
      const contentFilters = [...new Set(sourceEntries.map(([source, rule]) => `${source} ${rule.content_type || "不限"}`).filter(Boolean))];
      const timeText = timeFilters.length === 1 ? timeFilters[0] : timeFilters.join(" / ");
      const sortText = sortFilters.join(" / ");
      const contentText = contentFilters.join(" / ");
      return [timeText, sortText, contentText].filter(Boolean).join("；");
    }

    function render() {
      if (!mapData) return;
      renderSampleLine();
      const cards = visibleOpportunities().map((opp, index) => renderCard(opp, index + 1)).join("");
      app.className = "opportunity-list";
      app.innerHTML = renderEvidencePolicy() + (cards || (AGE_MODE ? ageEmptyState() : `<div class="empty">暂无问题卡片。</div>`)) + (AGE_MODE ? renderAgeAppendices() : renderLegacyAppendices());
      app.querySelectorAll("[data-aux]").forEach(button => {
        button.addEventListener("click", () => {
          openAux[button.dataset.aux] = !openAux[button.dataset.aux];
          render();
        });
      });
      app.querySelectorAll(".opportunity-button").forEach(button => {
        button.addEventListener("click", () => {
          openId = openId === button.dataset.id ? null : button.dataset.id;
          if (openId && !evidenceLimits[openId]) evidenceLimits[openId] = INITIAL_EVIDENCE_LIMIT;
          syncHashState(openId ? { opportunityId: openId } : {});
          render();
        });
      });
      app.querySelectorAll("[data-evidence-action]").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          const id = button.dataset.id;
          const action = button.dataset.evidenceAction;
          const total = Number(button.dataset.total || 0);
          const current = evidenceLimits[id] || INITIAL_EVIDENCE_LIMIT;
          if (action === "more") evidenceLimits[id] = Math.min(total, current + EVIDENCE_PAGE_SIZE);
          if (action === "all") evidenceLimits[id] = total;
          if (action === "less") evidenceLimits[id] = INITIAL_EVIDENCE_LIMIT;
          render();
        });
      });
      app.querySelectorAll("[data-cluster-id]").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          const opportunityId = button.dataset.opportunityId;
          const clusterId = button.dataset.clusterId;
          openClusterIds[opportunityId] = openClusterIds[opportunityId] === clusterId ? null : clusterId;
          openSubNeedIds[clusterLimitKey(opportunityId, clusterId)] = null;
          if (openClusterIds[opportunityId]) {
            const limitKey = clusterLimitKey(opportunityId, clusterId);
            if (!evidenceLimits[limitKey]) evidenceLimits[limitKey] = INITIAL_EVIDENCE_LIMIT;
          }
          syncHashState(openClusterIds[opportunityId] ? { opportunityId, clusterId } : { opportunityId });
          render();
        });
      });
      app.querySelectorAll("[data-sub-need-id]").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          const clusterKey = button.dataset.clusterKey;
          const subNeedId = button.dataset.subNeedId;
          const [opportunityId, clusterId] = clusterKey.split("::");
          openSubNeedIds[clusterKey] = openSubNeedIds[clusterKey] === subNeedId ? null : subNeedId;
          if (openSubNeedIds[clusterKey]) {
            const limitKey = subNeedLimitKey(clusterKey, subNeedId);
            if (!evidenceLimits[limitKey]) evidenceLimits[limitKey] = INITIAL_EVIDENCE_LIMIT;
          }
          syncHashState(openSubNeedIds[clusterKey] ? { opportunityId, clusterId, subNeedId } : { opportunityId, clusterId });
          render();
        });
      });
      scrollToPendingTarget();
    }

    function applyHashState() {
      if (typeof window === "undefined" || !window.location || !window.location.hash) return;
      const params = new URLSearchParams(window.location.hash.slice(1));
      const opportunityId = params.get("opp");
      const clusterId = params.get("cluster");
      const subNeedId = params.get("sub");
      if (!opportunityId || !visibleOpportunities().some(opp => opp.id === opportunityId)) return;
      openId = null;
      openClusterIds = {};
      openSubNeedIds = {};
      openId = opportunityId;
      pendingScrollTarget = `.opportunity-button[data-id="${cssEscape(opportunityId)}"]`;
      evidenceLimits[opportunityId] = evidenceLimits[opportunityId] || INITIAL_EVIDENCE_LIMIT;
      if (clusterId) {
        openClusterIds[opportunityId] = clusterId;
        const clusterKey = clusterLimitKey(opportunityId, clusterId);
        pendingScrollTarget = `[data-cluster-id="${cssEscape(clusterId)}"][data-opportunity-id="${cssEscape(opportunityId)}"]`;
        evidenceLimits[clusterKey] = evidenceLimits[clusterKey] || INITIAL_EVIDENCE_LIMIT;
        if (subNeedId) {
          openSubNeedIds[clusterKey] = subNeedId;
          const limitKey = subNeedLimitKey(clusterKey, subNeedId);
          pendingScrollTarget = `[data-sub-need-id="${cssEscape(subNeedId)}"][data-cluster-key="${cssEscape(clusterKey)}"]`;
          evidenceLimits[limitKey] = evidenceLimits[limitKey] || INITIAL_EVIDENCE_LIMIT;
        }
      }
    }

    function syncHashState({ opportunityId, clusterId, subNeedId }) {
      if (typeof window === "undefined" || !window.location || !window.history || typeof window.history.replaceState !== "function") return;
      const url = new URL(window.location.href);
      if (!opportunityId) {
        url.hash = "";
      } else {
        const params = new URLSearchParams();
        params.set("opp", opportunityId);
        if (clusterId) params.set("cluster", clusterId);
        if (subNeedId) params.set("sub", subNeedId);
        url.hash = params.toString();
      }
      window.history.replaceState(null, "", url.href);
    }

    function cssEscape(value) {
      if (typeof CSS !== "undefined" && CSS.escape) return CSS.escape(value);
      return String(value).replace(/["\\]/g, "\\$&");
    }

    function scrollToPendingTarget() {
      if (!pendingScrollTarget || typeof window === "undefined" || typeof window.requestAnimationFrame !== "function") return;
      const selector = pendingScrollTarget;
      pendingScrollTarget = "";
      window.requestAnimationFrame(() => {
        const target = document.querySelector(selector);
        if (target) target.scrollIntoView({ block: "start", behavior: "smooth" });
      });
    }

    function renderCard(opp, rank) {
      const isOpen = openId === opp.id;
      const count = countComments(opp);
      const sourceText = mergeSourceCounts(opp).map(([source, value]) => `${source} ${formatNum(value)}`).join(" / ");
      const displayTitle = AGE_MODE ? opp.title : themeDomainTitle(opp);
      const displaySummary = AGE_MODE ? opp.sentence : "";
      return `
        <article class="opportunity-card">
          <button class="opportunity-button ${isOpen ? "active" : ""}" type="button" data-id="${escapeHtml(opp.id)}" aria-expanded="${isOpen}">
            <div class="row-main">
              <div class="rank-title">
                ${AGE_MODE ? "" : `<span class="rank">${rank}</span>`}
                <div>
                  ${AGE_MODE ? `<div class="eyebrow">机会假设</div>` : ""}
                  <div class="title">${escapeHtml(displayTitle)}</div>
                  ${AGE_MODE ? `<div class="summary">${escapeHtml(displaySummary)}</div>` : ""}
                  ${AGE_MODE ? `<div class="summary">${escapeHtml(opp.hypothesis_status || "待验证假设，不构成需求成立结论")}</div>` : ""}
                </div>
              </div>
              <div class="metric"><strong>${formatNum(count)}</strong>${AGE_MODE ? "证据评论" : "条评论"}<br>${escapeHtml(sourceText)}${AGE_MODE ? `<br>已识别帖子 ${formatNum(opp.evidence_summary?.post_count ?? opp.post_count ?? 0)}${(opp.evidence_summary?.post_count ?? opp.post_count ?? 0) <= 1 ? " · 单帖样本不足" : ""}<br>已观察供给 ${formatNum((opp.supply || []).length)} · 验证点 ${formatNum((opp.validation || []).length)}` : ""}</div>
              <span class="toggle-mark">${isOpen ? "−" : "+"}</span>
            </div>
          </button>
          <div class="details ${isOpen ? "open" : ""}">
            ${isOpen ? renderDetails(opp) : ""}
          </div>
        </article>
      `;
    }

    function themeDomainTitle(opp) {
      const names = (opp.themeIds || []).map(id => findTheme(id)?.concern_name).filter(Boolean);
      return names.length ? names.join(" / ") : opp.title;
    }

    function themeDomainSummary(opp) {
      const clusters = findClusters(opp);
      const names = clusters.slice(0, 3).map(cluster => cluster.name).filter(Boolean).join("、");
      const more = clusters.length > 3 ? `等 ${formatNum(clusters.length)} 个需求簇` : `${formatNum(clusters.length)} 个需求簇`;
      const sourceText = mergeSourceCounts(opp).map(([source, value]) => `${source} ${formatNum(value)}`).join(" / ");
      return `${formatNum(countComments(opp))} 条评论（${sourceText || "暂无平台分布"}），覆盖${names ? `「${names}」${more}` : more}。`;
    }

    function renderDetails(opp) {
      const clusters = findClusters(opp);
      if (!AGE_MODE) return renderThemeDomainDetails(opp, clusters);
      return `
        <div class="judgement">
          <div class="fact"><div class="fact-label">谁</div><div class="fact-value">${escapeHtml(opp.who)}</div></div>
          <div class="fact"><div class="fact-label">什么场景</div><div class="fact-value">${escapeHtml(opp.scene)}</div></div>
          <div class="fact"><div class="fact-label">遇到什么问题</div><div class="fact-value">${escapeHtml(opp.problem)}</div></div>
          <div class="fact"><div class="fact-label">目前使用什么办法</div><div class="fact-value">${escapeHtml(opp.current)}</div></div>
        </div>
        <div class="detail-grid">
          <section class="section">
            <h2>${AGE_MODE ? "候选供给（官网核验，非家长使用记录）" : "现有供给"}</h2>
            <ul class="list">${opp.supply.map(renderSupply).join("") || (AGE_MODE ? "<li>暂无已核验的关联供给。</li>" : "")}</ul>
          </section>
          <section class="section">
            <h2>${AGE_MODE ? "待验证供给假设" : "供给缺口"}</h2>
            <p>${escapeHtml(opp.gap)}</p>
            <h2>还缺什么验证</h2>
            <ul class="list">${opp.validation.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
          </section>
          <section class="section cluster-section">
            <h2>${AGE_MODE ? "关联需求簇" : "需求簇与机会假设"}</h2>
            <div class="cluster-list">${clusters.map(cluster => renderClusterRow(opp, cluster)).join("")}</div>
          </section>
        </div>
      `;
    }

    function renderThemeDomainDetails(opp, clusters) {
      return `
        <section class="section cluster-section">
          <h2>需求簇</h2>
          <div class="cluster-list">${clusters.map(cluster => renderClusterRow(opp, cluster)).join("")}</div>
        </section>
      `;
    }

    function subNeedPreview(cluster) {
      const subNeeds = cluster.sub_need_points || [];
      if (!subNeeds.length) return "未继续拆分";
      const names = subNeeds.slice(0, 3).map(item => item.name).filter(Boolean).join("、");
      return subNeeds.length > 3 ? `${names}等` : names;
    }

    function renderClusterRow(opp, cluster) {
      const isOpen = openClusterIds[opp.id] === cluster.cluster_id;
      const totalCount = collectClusterEvidence(cluster).length;
      return `
        <button class="cluster-row ${isOpen ? "active" : ""}" type="button" data-opportunity-id="${escapeHtml(opp.id)}" data-cluster-id="${escapeHtml(cluster.cluster_id)}" aria-expanded="${isOpen}">
          <span class="cluster-name">${escapeHtml(cluster.name)}</span>
          <span class="cluster-count">${formatNum(totalCount)} 条${cluster.cluster_id === "T06-C2" && (cluster.comment_count || 0) <= 1 ? " · 证据不足" : ""}</span>
          <span class="toggle-mark">${isOpen ? "−" : "+"}</span>
        </button>
        ${isOpen ? renderClusterPanel(opp, cluster) : ""}
      `;
    }

    function renderClusterPanel(opp, cluster) {
      const key = clusterLimitKey(opp.id, cluster.cluster_id);
      const subNeeds = (cluster.sub_need_points || []).length ? cluster.sub_need_points : [{
        sub_need_id: `${cluster.cluster_id}-S-all`,
        name: '未继续拆分',
        summary: '该需求簇暂无可稳定拆出的子需求点，先展示全部评论证据。',
        comment_count: collectClusterEvidence(cluster).length,
        all_evidence: collectClusterEvidence(cluster)
      }];
      return `
        <div class="cluster-panel">
          <div class="cluster-panel-title">
            <div>
              <div class="cluster-name">${escapeHtml(cluster.name)}</div>
              <div class="cluster-count">${escapeHtml(cluster.type)} · 全部 ${formatNum(collectClusterEvidence(cluster).length)} 条 · ${formatNum(subNeeds.length)} 个子需求点${cluster.cluster_id === "T06-C2" && (cluster.comment_count || 0) <= 1 ? " · 证据不足，需访谈验证" : ""}</div>
            </div>
          </div>
          <div class="cluster-list">${subNeeds.map(subNeed => renderSubNeedRow(opp, key, subNeed)).filter(Boolean).join("") || `<div class="empty">暂无子需求点。</div>`}</div>
        </div>
      `;
    }

    function renderSubNeedRow(opp, clusterKey, subNeed) {
      const totalEvidence = dedupeEvidence(subNeed.all_evidence || []);
      if (!totalEvidence.length) return "";
      const isOpen = openSubNeedIds[clusterKey] === subNeed.sub_need_id;
      const limitKey = subNeedLimitKey(clusterKey, subNeed.sub_need_id);
      const evidence = totalEvidence;
      const evidenceLimit = Math.min(evidence.length, evidenceLimits[limitKey] || INITIAL_EVIDENCE_LIMIT);
      const visibleEvidence = evidence.slice(0, evidenceLimit);
      const counts = signalCounts(totalEvidence);
      return `
        <div>
          <button class="cluster-row ${isOpen ? "active" : ""}" type="button" data-cluster-key="${escapeHtml(clusterKey)}" data-sub-need-id="${escapeHtml(subNeed.sub_need_id)}" aria-expanded="${isOpen}">
            <span class="cluster-name">${escapeHtml(subNeed.name)}</span>
            <span class="cluster-count">${formatNum(totalEvidence.length)} 条</span>
            <span class="toggle-mark">${isOpen ? "−" : "+"}</span>
          </button>
          ${isOpen ? `<div class="cluster-panel">${renderOpportunityHypothesisCard(opp, subNeed, totalEvidence, counts)}${renderMindFunnel(subNeed, totalEvidence, evidence, limitKey, evidenceLimit, visibleEvidence)}</div>` : ""}
        </div>
      `;
    }

    function renderOpportunityHypothesisCard(opp, subNeed, totalEvidence, counts) {
      const hypothesis = subNeed.opportunity_hypothesis || buildSubNeedOpportunityHypothesis(opp, subNeed, totalEvidence, counts);
      return `<section class="hypothesis-card">
        <div class="hypothesis-head">
          <div>
            <div class="eyebrow">机会假设卡片</div>
            <h3 class="hypothesis-title">${escapeHtml(hypothesis.title)}</h3>
          </div>
        </div>
        <div class="hypothesis-grid">
          <div class="fact"><div class="fact-label">谁</div><div class="fact-value">${escapeHtml(hypothesis.who)}</div></div>
          <div class="fact"><div class="fact-label">什么场景</div><div class="fact-value">${escapeHtml(hypothesis.scene)}</div></div>
          <div class="fact"><div class="fact-label">遇到什么问题</div><div class="fact-value">${escapeHtml(hypothesis.problem)}</div></div>
          <div class="fact"><div class="fact-label">目前使用什么办法</div><div class="fact-value">${escapeHtml(hypothesis.current)}</div></div>
          <div class="fact"><div class="fact-label">现有供给</div><div class="fact-value">${renderSupplySummary(hypothesis.supply, hypothesis.supply_research)}</div></div>
          <div class="fact"><div class="fact-label">供给缺口</div><div class="fact-value">${escapeHtml(hypothesis.supplyGap)}</div></div>
        </div>
        <section class="section">
          <h2>还缺什么验证</h2>
          <ul class="list">${hypothesis.validation.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
        </section>
      </section>`;

      const comments = link.comment_evidence || [];
      const relationshipTags = Object.entries(link.relationship_counts || {}).map(([key, value]) =>
        `<span class="supply-tag">${escapeHtml(supplyRelationshipLabel(key))} ${formatNum(value)}</span>`).join("");

      const quoteRows = comments.slice(0, 2).map(row => `<div class="supply-quote">“${escapeHtml(row.quote)}” · ${escapeHtml(supplyRelationshipLabel(row.relationship))}</div>`).join("");
      return `<div class="supply-item">

      const labels = {
        covered: "已找到直接供给",

        method_only: "当前以方法供给为主",

      const links = research?.links || [];
      const userUsing = links.filter(link => (link.comment_evidence || []).some(row => ["using", "used"].includes(row.relationship)) && link.fit_type !== "counterexample");
      const userSeeking = links.filter(link => (link.comment_evidence || []).some(row => ["seeking", "considering", "recommended"].includes(row.relationship)) && !userUsing.includes(link) && link.fit_type !== "counterexample");
      const verified = links.filter(link => link.origin === "official" && link.fit_type !== "counterexample");
      const counterexamples = links.filter(link => link.fit_type === "counterexample"
        || (link.comment_evidence || []).some(row => ["rejected", "abandoned", "refunded", "complained"].includes(row.relationship)));
      const usedIds = new Set([...userUsing, ...userSeeking, ...verified, ...counterexamples].map(link => link.supply_id));
      const other = links.filter(link => !usedIds.has(link.supply_id));
      const group = (title, rows) => rows.length ? `<div class="supply-group"><div class="supply-group-title">${title}</div>${rows.map(renderSupplyLink).join("")}</div>` : "";
      return `<div class="supply-research">

        ${group("其他关联供给", other)}
      </div>`;
    }

      const text = [subNeed.name, subNeed.summary, ...(totalEvidence || []).flatMap(row => [row.comment_text, row.parent_post_title, row.keyword])].filter(Boolean).join(" ");
      const targeted = [];
      const add = (items, regex) => { if (regex.test(text)) targeted.push(...items); };
      add(["洪恩拼音/识字、悟空拼音/识字等基础学习 App", "小猿口算、作业帮口算等口算/拍照批改工具", "同步练习册、专项练习册、试卷和资料包", "学习机、拍照讲题和 AI 辅导工具"], /拼音|识字|认字|生字|读题|阅读|口算|数学|应用题|基础/u);
      add(["晚托、托管、课后辅导班", "计时器、计划表、习惯打卡工具", "作业辅导类学习机或 App", "家长教练/亲子沟通课程"], /作业|拖拉|陪写|订正|坐不住|习惯|执行/u);
      add(["专注力训练课程、感统训练机构", "线上测评和儿童发展评估", "家庭训练清单和家长教育内容", "注意力训练软件或硬件"], /专注|走神|注意力|ADHD|感统|坐不住/u);
      add(["校内课后服务", "社区托管和晚辅导机构", "一对一上门/线上辅导", "接送和看护服务"], /托管|晚托|课后|接送|看管|双职工/u);
      add(["家校沟通 App 和班级群", "沟通话术、事件记录和维权攻略", "儿童心理咨询和校园安全课程", "定位手表等安全设备"], /老师|家校|学校|校园|被欺负|沟通|安全/u);
      add(["学而思、作业帮、小猿、科大讯飞、希沃、步步高等学习机/学习平板", "词典笔、错题机、打印机", "护眼灯、学习桌椅", "达人测评、导购直播、家长社群、二手/租赁试用"], /学习机|学习桌|护眼灯|台灯|打印机|词典笔|硬件|工具/u);
      add(["幼小衔接课程和资料包", "时间管理表、习惯打卡工具", "育儿博主攻略和家长社群", "线下衔接班、托管和兴趣班组合"], /幼小衔接|入学|适应|开学|作息|超前|兴趣班/u);
      return [...targeted, ...base].filter(uniqueValue);
    }

    function uniqueValue(value, index, array) {
      return value && array.indexOf(value) === index;
    }

    function isGenericInsight(text) {
      const value = String(text || "").trim();
      if (!value) return true;
      return /具体困难|遇到.*困难|暂无可稳定拆出|该需求簇暂无|求助、吐槽、询价|卡点：[^。；，]*遇到/u.test(value);
    }

    function evidenceSnippets(rows, limit = 2) {
      return dedupeEvidence(rows || [])
        .map(row => String(row.comment_text || "").replace(/\s+/g, " ").trim())
        .filter(Boolean)
        .slice(0, limit)
        .map(text => text.length > 42 ? `${text.slice(0, 42)}...` : text);
    }

    function evidenceCategories(rows, fallbackText = "") {
      const text = `${fallbackText} ${(rows || []).map(row => row.comment_text || "").join(" ")}`;
      const categories = [];
      if (/拼音|声母|韵母|平翘舌|拼读|音节/u.test(text)) categories.push("拼音拼读");
      if (/识字|认字|生字|写字|笔顺|默写|听写/u.test(text)) categories.push("识字写字");
      if (/阅读|读题|读书|精读|朗读|绘本/u.test(text)) categories.push("阅读读题");
      if (/数学|口算|计算|应用题|思维/u.test(text)) categories.push("数学计算");
      if (/作业|拖拉|订正|陪写|坐不住/u.test(text)) categories.push("作业执行");
      if (/学习桌|台灯|学习机|打印机|练习册|资料|链接|工具/u.test(text)) categories.push("工具/资料选择");
      return [...new Set(categories)].slice(0, 4);
    }

    function specificSceneFromEvidence(snippets, categories) {
      const categoryText = categories.length ? categories.join("、") : "该子需求";
      if (snippets.length) return `围绕${categoryText}，评论中出现“${snippets.join("”“")}”这类具体讨论。`;
      return `围绕${categoryText}出现求助、吐槽、询价或经验交流时。`;
    }

    function specificProblemFromEvidence(evidenceCount, snippets, categories) {
      if (evidenceCount <= 3) {
        return "样本偏少，暂不能稳定归纳为单一具体问题；需先复核这些评论是否真的同属该子需求。";
      }
      const categoryText = categories.length ? categories.join("、") : "该子需求";
      return `${categoryText}相关问题仍需继续拆细；当前先以评论原文校准具体卡点。`;
    }

    function signalCounts(evidence) {
      return {
        all: evidence.length,
        content: evidence.filter(matchesContentSignal).length,
        product: evidence.filter(matchesProductStrongSignal).length,
        productWeak: evidence.filter(matchesProductWeakSignal).length,
        resource: evidence.filter(matchesResourceNoise).length
      };
    }

    function renderMindFunnel(subNeed, totalEvidence, evidence, limitKey, evidenceLimit, visibleEvidence) {
      const scopeMeta = `${formatNum(visibleEvidence.length)} / ${formatNum(evidence.length)} 条 · 全部 ${formatNum(totalEvidence.length)} 条`;
      return `<div><div class="cluster-panel-title"><div><div class="cluster-count">${escapeHtml(scopeMeta)}</div></div>${renderEvidenceActions(limitKey, evidenceLimit, evidence.length)}</div>${visibleEvidence.map(renderEvidence).join("") || `<div class="empty">暂无评论证据。</div>`}</div>`;
    }

    function filterEvidenceByIds(visibleRows, candidateRows) {
      const keys = new Set(visibleRows.map(evidenceIdentity));
      return dedupeEvidence(candidateRows || []).filter(row => keys.has(evidenceIdentity(row)));
    }

    function evidenceIdentity(comment) {
      if (comment.comment_id != null && comment.comment_id !== "") return JSON.stringify([comment.source_key || comment.source || "unknown", String(comment.comment_id)]);
      return JSON.stringify([comment.source_key || comment.source || "unknown", comment.author_nickname || "", comment.comment_text || "", comment.parent_post_id || ""]);
    }

    function clusterLimitKey(opportunityId, clusterId) {
      return `${opportunityId}::${clusterId}`;
    }

    function subNeedLimitKey(clusterKey, subNeedId) {
      return `${clusterKey}::${subNeedId}`;
    }

    function renderEvidenceActions(id, visibleCount, totalCount) {
      if (totalCount <= INITIAL_EVIDENCE_LIMIT) return "";
      const escapedId = escapeHtml(id);
      const total = String(totalCount);
      const actions = [];
      if (visibleCount < totalCount) {
        actions.push(`<button class="small-button" type="button" data-evidence-action="more" data-id="${escapedId}" data-total="${total}">更多 20 条</button>`);
        actions.push(`<button class="small-button" type="button" data-evidence-action="all" data-id="${escapedId}" data-total="${total}">展开全部</button>`);
      }
      if (visibleCount > INITIAL_EVIDENCE_LIMIT) {
        actions.push(`<button class="small-button" type="button" data-evidence-action="less" data-id="${escapedId}" data-total="${total}">收起到 ${INITIAL_EVIDENCE_LIMIT} 条</button>`);
      }
      return `<div class="evidence-actions">${actions.join("")}</div>`;
    }

    function renderEvidence(comment) {
      const author = comment.author_nickname || "未知用户";
      const source = comment.source || "未知渠道";
      const keyword = comment.keyword ? `搜索词：${comment.keyword}` : "";
      const likes = AGE_MODE && comment.like_count == null ? null : Number(comment.like_count || 0);
      const replies = AGE_MODE && comment.reply_count == null ? null : Number(comment.reply_count || 0);
      const parentLink = safeURL(comment.parent_post_url);
      const commentLink = safeURL(comment.comment_url);
      const isCommentLink = comment.link_kind === "comment" && commentLink && commentLink !== parentLink;
      const link = isCommentLink ? commentLink : parentLink || commentLink;
      const linkLabel = isCommentLink ? "原评论链接" : "原帖链接";
      const postTitle = (comment.parent_post_title || "").replace(/\s+/g, " ").trim();
      return `
        <div class="evidence">
          <p class="quote">“${escapeHtml(comment.comment_text)}”</p>
          <div class="meta">
            <span>${escapeHtml(source)}</span>
            <span>${escapeHtml(author)}</span>
            ${keyword ? `<span>${escapeHtml(keyword)}</span>` : ""}
            ${AGE_MODE && ["unknown", "ambiguous"].includes(comment.audience_id) ? `<span>${comment.audience_id === "ambiguous" ? "年龄/学段有歧义" : "年龄未明确"}</span>` : ""}
            <span>点赞 ${likes == null ? "未提供" : formatNum(likes)}</span>
            <span>回复 ${replies == null ? "未提供" : formatNum(replies)}</span>
            ${link ? `<a href="${escapeHtml(link)}" target="_blank" rel="noreferrer">${linkLabel}</a>` : ""}
          </div>
          ${postTitle ? `<div class="source-tail">原帖：${escapeHtml(postTitle.slice(0, 90))}${postTitle.length > 90 ? "..." : ""}</div>` : ""}
          ${AGE_MODE && (comment.comment_context || comment.parent_post_context) ? `<div class="context">语境：${escapeHtml(comment.comment_context || comment.parent_post_context)}</div>` : ""}
          ${AGE_MODE && comment.audience_basis ? `<div class="context">年龄依据：${escapeHtml(typeof comment.audience_basis === "string" ? comment.audience_basis : Object.values(comment.audience_basis).join("；"))}</div>` : ""}
        </div>
      `;
    }

    function renderPoolEvidence(rows, limitKey) {
      const limit = Math.min(rows.length, evidenceLimits[limitKey] || INITIAL_EVIDENCE_LIMIT);
      return `<div class="evidence-head"><h2>评论 ${formatNum(limit)} / ${formatNum(rows.length)}</h2>${renderEvidenceActions(limitKey, limit, rows.length)}</div>${rows.slice(0, limit).map(renderEvidence).join("") || `<div class="empty">暂无记录。</div>`}`;
    }

    function renderPoolSection(id, title, pool, reasonField, description) {
      const rows = dedupeEvidence(pool?.all_evidence || []);
      if (!rows.length) return "";
      const groups = Object.entries(rows.reduce((acc, row) => {
        const key = row[reasonField] || "未标注原因";
        if (!acc[key]) acc[key] = [];
        acc[key].push(row);
        return acc;
      }, {}));
      return `<section class="evidence">
        <button class="small-button" type="button" data-aux="${escapeHtml(id)}" aria-expanded="${Boolean(openAux[id])}">${openAux[id] ? "收起" : "展开"}${escapeHtml(title)}（${formatNum(rows.length)} 条）</button>
        ${openAux[id] ? `<p class="context">${escapeHtml(description)}</p>${groups.map(([reason, items]) => `<section class="section evidence-list"><h2>${escapeHtml(reason)} · ${formatNum(items.length)} 条</h2>${renderPoolEvidence(items, `${id}:${reason}`)}</section>`).join("")}` : ""}
      </section>`;
    }

    function renderCountComparison() {
      const rows = mapData.cluster_count_comparison || [];
      if (!rows.length) return "";
      return `<section class="evidence"><button class="small-button" type="button" data-aux="count-comparison" aria-expanded="${Boolean(openAux["count-comparison"])}">${openAux["count-comparison"] ? "收起" : "展开"}旧值 → 新值计数对比（${formatNum(rows.length)} 个主题）</button>${openAux["count-comparison"] ? `<div class="cluster-list">${rows.map(row => `<div class="cluster-panel"><div class="cluster-panel-title"><div><div class="cluster-name">${escapeHtml(row.theme_id)} ${escapeHtml(row.concern_name)}</div><div class="cluster-count">旧 ${formatNum(row.old_count)} → 新 ${formatNum(row.new_count)} · 变化 ${formatNum(row.delta)}</div></div></div><div class="context">${escapeHtml(row.reason)}</div></div>`).join("")}</div>` : ""}</section>`;
    }

    function renderLegacyAppendices() {
      if (AGE_MODE) return "";
      return renderPoolSection("indirect", "间接需求信号", mapData.indirect_signal_pool, "indirect_reason", "机构/B2B/软广帖下疑似家长咨询，未计入主计数，作为访谈验证线索。")
        + renderPoolSection("low-signal", "低信号与一般观点", mapData.low_signal_pool, "low_signal_reason", "逐条理解后未发现目标家长的具体问题、咨询、经历或使用反馈，不进入需求主计数。")
        + renderPoolSection("unmatched", "未匹配池", mapData.unmatched_pool, "unmatched_reason", "短评论语义不足或无法稳定归簇的评论，不强行归入主题。")
        + renderPoolSection("out-of-scope", "人群不符", mapData.out_of_scope_pool, "exclusion_reason", "明确属于其他年龄、学段或角色的评论，不作为小学一年级家长需求证据。")
        + renderPoolSection("intercept", "拦截台账", mapData.intercept_pool, "intercept_reason", "营销/引流、同行互评等不进入需求证据，但保留可追溯原因。")
        + renderCountComparison();
    }

    initAgeMode();
    fetch(DATA_URL)
      .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(data => {
        mapData = data;
        applyHashState();
        render();
      })
      .catch(error => {
        app.className = "empty";
        app.innerHTML = AGE_MODE ? "读取数据失败，请检查公开数据文件是否可访问后重试。" : `读取数据失败：${escapeHtml(error.message)}。请通过本地服务访问本页。`;
      });
    if (typeof window !== "undefined" && typeof window.addEventListener === "function") {
      window.addEventListener("hashchange", () => {
        if (!mapData) return;
        applyHashState();
        render();
      });
    }
  </script>
</body>
</html>
